# Jalankan aplikasi:          docker compose up --build
# Latih ulang model (opsional): docker compose --profile train run --rm pipeline
# Lihat MLflow UI (opsional):   docker compose --profile mlflow up mlflow   -> http://localhost:5000
services:
  backend:
    build: .
    image: dass42-demo:latest
    command: uvicorn src.backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    image: dass42-demo:latest
    command: streamlit run src/frontend/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

  pipeline:
    profiles: ["train"]
    build:
      context: .
      args:
        INSTALL_TRAIN: "true"
    image: dass42-train:latest
    command: python -m src.run_pipeline
    user: root
    volumes:
      - ./models:/app/models
      - ./data/processed:/app/data/processed
      - ./mlflow-data:/app/mlflow-data
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow-data/mlflow.db
      MLFLOW_ARTIFACT_ROOT: /app/mlflow-data/artifacts

  mlflow:
    profiles: ["mlflow"]
    image: dass42-train:latest
    command: mlflow ui --backend-store-uri sqlite:////app/mlflow-data/mlflow.db --host 0.0.0.0 --port 5000
    user: root
    volumes:
      - ./mlflow-data:/app/mlflow-data
    ports:
      - "5000:5000"
